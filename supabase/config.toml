# A string used to distinguish different Supabase projects on the same host.
project_id = "agentcy-control"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3001"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.external.github]
enabled = false
client_id = ""
secret = ""
redirect_uri = ""

[analytics]
enabled = false
port = 54327
vector_port = 54328

[functions.copilot]
verify_jwt = true

[functions.ingest-vercel]
verify_jwt = false

[functions.ingest-sentry]
verify_jwt = false

[functions.ingest-posthog]
verify_jwt = false

[functions.synthetic-checker]
verify_jwt = false

[functions.secure-store]
verify_jwt = true

[functions.send-email]
verify_jwt = true

# Edge Function secrets - set via: supabase secrets set GROQ_API_KEY=xxx
# GROQ_API_KEY = "env(GROQ_API_KEY)"
# RESEND_API_KEY = "env(RESEND_API_KEY)"
# SENTRY_API_KEY = "env(SENTRY_API_KEY)"
# VERCEL_API_TOKEN = "env(VERCEL_API_TOKEN)"
